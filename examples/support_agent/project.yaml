# Example project: a support agent over a real stateful CRM.
#
#   python -m examples.support_agent.record --scripted --n 260 --out traces.jsonl
#   agentdistill ingest jsonl traces-train.jsonl --config project.yaml
#   agentdistill evalset add support-holdout-v1 eval-holdout.jsonl --config project.yaml
#   agentdistill evalset add support-unseen-v1  eval-unseen.jsonl  --config project.yaml
#   agentdistill curate --config project.yaml
name: support-agent
registry: sqlite:///.agentdistill/registry.db
artifacts: ./artifacts
reports: ./reports

sources:
  - type: jsonl
    path: traces-train.jsonl

curate:
  # `pii` is deliberately absent. This agent's core tool is get_customer(email), so a redactor that masks emails
  # rewrites a tool argument in every single trace, and the filter -- correctly, by its own rule -- drops the
  # entire corpus. An agent whose tools legitimately take personal data as arguments needs pseudonymization that
  # preserves referential integrity, not masking. See docs/curation.md.
  filters: [outcome, schema_valid, no_error_loops, length, exact_dedupe, near_dedupe, decontaminate, stratify]
  near_dedupe_threshold: 0.85
  min_turns: 1
  max_turns: 40
  clusters: 8
  cap_per_cluster: 120
  embeddings:
    provider: hash
    dim: 128

dataset:
  max_seq_len: 4096
  window_turns: 12

train:
  # Checked with `agentdistill base-check Qwen/Qwen2.5-7B-Instruct`: template renders tools, is prefix-stable, and
  # the tool call survives the round trip through the hermes parser. Results for every candidate are in
  # docs/progress.md.
  base_model: Qwen/Qwen2.5-7B-Instruct
  # Pinned by commit, never by tag: a tag moves, and then a rerun trains on different weights than the report
  # says it did. Changing this means rebuilding the dataset -- `train sft` refuses a dataset tokenized elsewhere.
  base_model_revision: a09a35458c702b33eeacc393d103063234e8bc28
  method: sft
  max_seq_len: 4096
  epochs: 2
  lr: 1.0e-4
  seed: 17
  tool_parser:
    # vLLM's parser name, and the regex family used when vLLM is not installed. base-check detected hermes.
    name: hermes
    family: hermes

teacher:
  # Distillation needs a teacher to distil from and to price against. The key belongs in the environment, with a
  # hard spend cap set at the provider: the rollout and eval stages call this in a loop.
  model: claude-opus-5
  provider: anthropic
  # Prices come from the registry (`agentdistill pricing set`), so a run is priced by the row in force when it
  # ran rather than by whatever the config says today.
  pricing_from_registry: true

eval:
  eval_set: support-holdout-v1
  calib_set: support-calib-v1
  n_per_task: 5
  policy: strict
  # Live, because this example's tools are a local, deterministic, per-task-seeded SQLite CRM. Replay would grade
  # every subject on how closely it reproduces the recorded solver's exact calls: a lookup by email where the
  # script used the id is counted as a divergence and fails the task, even though the environment answers it
  # perfectly well. `policy` above applies to replay mode only and is kept for `--tools replay` runs, which is
  # how the distortion of replay grading gets measured rather than assumed.
  tools: live
  # Live mode imports this module and uses its `task_for_trace` to build a fresh CRM from the task's db_seed;
  # replay mode uses the `grade_outcome` callable. One source, both modes.
  grader: {type: predicate, predicate_source: "examples.support_agent.replay_grader:grade_outcome"}

onpolicy:
  # Rollouts against the real CRM too. In replay mode an on-policy trajectory has to be served by fuzzy match --
  # the student's phrasing drifts from the recording's -- and a fuzzily served success is not a real one. Live
  # tools remove the trade-off: the student sees the true result of the call it made.
  tools: live
