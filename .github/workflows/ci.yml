name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every test is offline by design: the tokenizer fixture is in-repo. This makes an accidental Hub call fail
  # loudly in CI rather than turning into a flaky network dependency.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: uv pip install --system -e ".[dev,tokenizers]"

      - name: Test
        run: pytest -q -m "not slow"

  train:
    name: training smoke (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      # bitsandbytes is omitted: it is CUDA-only and the smoke test runs unquantized on CPU.
      - run: uv pip install --system -e ".[dev,tokenizers]" "torch>=2.3" "trl>=0.12" "peft>=0.12" "accelerate>=0.33"
      - name: Two optimizer steps on a tiny model
        run: pytest -q tests/test_sft_smoke.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev,tokenizers]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy agentdistill

  example:
    name: example project runs end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev,tokenizers]"

      - name: Generate, ingest, curate
        working-directory: examples/support_agent
        run: |
          python generate_traces.py --n 500
          agentdistill ingest jsonl traces.jsonl --config project.yaml
          agentdistill evalset add support-holdout eval_tasks.jsonl --config project.yaml
          agentdistill curate --config project.yaml

      - name: Curation is deterministic
        working-directory: examples/support_agent
        run: |
          agentdistill curate --config project.yaml | tee second-run.txt
          grep -q "identical to" second-run.txt || {
            echo "::error::re-running curate produced a different dataset; curation is not deterministic"
            exit 1
          }

      - name: Dataset verifies
        working-directory: examples/support_agent
        run: agentdistill dataset verify "$(ls -d artifacts/datasets/*)"

      - name: Upload curation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curation-report
          path: examples/support_agent/reports/
